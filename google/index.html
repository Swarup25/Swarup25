                    <button class="btn lucky_btn">I'm Feeling Lucky</button>

            </div>
            <div class="lang">
                <p>Google offered in: <a
                        href="https://www.google.com/setprefs?sig=0_8oVGdR73Krom0jCLt5c6OpWk-4k%3D&amp;hl=bn&amp;source=homepage&amp;sa=X&amp;ved=0ahUKEwi0jbTHv_34AhU6umMGHan7D8kQ2ZgBCBE">বাংলা</a>

                    <a
                        href="https://www.google.com/setprefs?sig=0_8oVGdR73Krom0jCLt5c6OpWk-4k%3D&amp;hl=ta&amp;source=homepage&amp;sa=X&amp;ved=0ahUKEwi0jbTHv_34AhU6umMGHan7D8kQ2ZgBCBQ">தமிழ்</a>
                    <a
                        href="https://www.google.com/setprefs?sig=0_8oVGdR73Krom0jCLt5c6OpWk-4k%3D&amp;hl=gu&amp;source=homepage&amp;sa=X&amp;ved=0ahUKEwi0jbTHv_34AhU6umMGHan7D8kQ2ZgBCBU">ગુજરાતી</a>
                    <a

    <footer>

                <li>

            <ul class="footer_content right_footeer">

                    <a href="">Terms</a>
                </li>
                <li>

                </li>
            </ul>

    <script>
        const searchInput = document.querySelector("#search_input");

        searchInput.addEventListener("keydown", function (event) {
            if (event.code === "Enter") {
                search();
            }
        });

        function search() {
            const input = searchInput.value;

            window.location.href = "https://www.google.com/search?q=" + input + "&rlz=1C5CHFA_enNZ948NZ948&oq=" + input + "&aqs=chrome.0.69i59l2j46i175i199i433j46i199i291i433j46j0i433j0j69i60.875j0j9&sourceid=chrome&ie=UTF-8"
        }
    </script>
